source_id: on_ieso_demand_forecast
name: Ontario demand forecast, hourly, from the adequacy report
region_code: "on"
data_type: timeseries_numeric
adapter: xml_feed
update_frequency: 1h
scheduled_release: false

licence: >-
  IESO Terms of Use: limited, non-exclusive, non-sublicensable,
  non-transferrable licence with a mandatory attribution string.
licence_scope: unknown
terms_check: >-
  Verified 2026-08-19, same host and terms as on_ieso_zonal_price. Fetching
  permitted, redistribution unresolved.
signal_potential: >-
  IESO's own hour by hour Ontario demand forecast for the delivery day, revised
  through the day. Published, so the numbers carry no timing edge on their own.
  What is not published anywhere is how wrong this forecast usually is at a given
  horizon, and that distribution is what turns a point forecast into the
  probability a curtailment decision actually needs. Every reading is filed by
  how many hours ahead of its delivery hour it was issued, so the error can be
  measured per horizon rather than averaged into meaninglessness.

request:
  # Today's file in market time, not UTC time. IESO revises it through the day,
  # so refetching hourly walks the horizon down from 24 hours to zero.
  url: https://reports-public.ieso.ca/public/Adequacy3/PUB_Adequacy3_{date:%Y%m%d}.xml
  method: GET
  date_timezone: EST

parse:
  mode: timeseries
  timezone: EST
  base_date_path: "d:DocBody/d:DeliveryDate"
  records_path: ".//d:ForecastOntDemand/d:Demand"
  hour_path: "d:DeliveryHour"
  hour_base: 1
  value_path: "d:EnergyMW"
  series_literal: forecast_ontario_demand
  lead_time_path: "d:DocHeader/d:CreatedAt"
  # Horizon bands, in hours ahead of the delivery hour. The long bands are split
  # because the adequacy report is published about a month out and revised the
  # whole way in, so a single "48 hours or more" bucket would average a two day
  # forecast together with a five week one and call the result an error rate.
  lead_time_buckets: [0, 3, 6, 12, 24, 48, 120, 336]
  unit: MW

backfill:
  index_url: https://reports-public.ieso.ca/public/Adequacy3/
  pattern: 'PUB_Adequacy3_(\d{8})(?:_v(\d+))?\.xml'
  max_files: 400
  # Keep several revisions per delivery date, not just the final one. The final
  # file for a past day was issued after the day ended and therefore records no
  # forecast error; the early revisions are the forecast, and their spread across
  # the version range is what the horizon calibration is measured on.
  versions_per_period: 12

# No detectors. This series is an input to the peak model, not a thing to fire
# on: a forecast moving is not news, a forecast being wrong is, and that
# comparison needs two series.
detectors: []
